<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Síndico - AbrangeBox</title>
    <style>
        :root { --bg: #f1f5f9; --card: #ffffff; --primary: #10b981; --text: #1e293b; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); padding: 40px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 900px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: var(--card); padding: 25px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .card h3 { font-size: 14px; color: #64748b; margin-bottom: 10px; }
        .card p { font-size: 24px; font-weight: 700; color: var(--text); }
        .btn { display: inline-block; padding: 10px 20px; background: var(--primary); color: white; text-decoration: none; border-radius: 8px; margin-top: 20px; font-weight: 600; text-align: center; }
        .btn:hover { background-color: #059669; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; }
        th, td { padding: 12px; border-bottom: 1px solid #e2e8f0; text-align: left; }
        th { background-color: #f8fafc; color: #64748b; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <div style="text-align: center; margin-bottom: 20px;">
        <img src="logo.png" alt="Logo AbrangeBox" style="max-width: 550px; height: auto;">
    </div>
    
    <h1>Dashboard Admin: <span id="vaga-id" style="color: #64748b;">Consumo Geral do Condomínio</span></h1>
    
    <div class="stats-grid">
        <div class="card"><h3>Consumo Geral Acumulado</h3><p id="total-geral">Carregando...</p></div>
        <div class="card"><h3>Total de Registros</h3><p id="total-registros">0</p></div>
    </div>

    <div class="card">
        <h3>Histórico de Leituras Globais</h3>
        <table id="tabela-geral">
            <thead>
                <tr>
                    <th>Data/Hora</th>
                    <th>Vaga</th>
                    <th>Leitura Atual</th>
                </tr>
            </thead>
            <tbody id="corpo-tabela">
                <tr><td colspan="3" style="text-align: center; color: #64748b;">Buscando dados na planilha Google...</td></tr>
            </tbody>
        </table>
        <a href="https://docs.google.com/spreadsheets/d/e/2PACX-1vT7jyVJ-hTxoT7k5zigNKg_osDnCj7eC6yWKjSgH00h6FkFlHoekW5b0B09iPTxz7covHsfURZ4B98m/pub?gid=0&single=true&output=csv" target="_blank" class="btn">Abrir Planilha Original</a>
    </div>
</div>

<script>
    const URL_GAS = 'https://script.google.com/macros/s/AKfycbzokzR3uzo9PYgTFbRcXWp1X9tVUX0uFKDDgfBvKj_I1Ip7_omTZ1pJFWVzXcqROlcbLg/exec';

    window.onload = function() {
        carregarDadosGlobais();
    };

    async function carregarDadosGlobais() {
        try {
            // Requisita via POST os dados globais para o Apps Script
            const resposta = await fetch(URL_GAS, {
                method: 'POST',
                body: JSON.stringify({
                    vaga: "ADMIN", // Bypass strings para preencher o JSON.parse do script
                    senha: "ADMIN",
                    acao: "buscar_todos_os_dados"
                })
            });

            const resultado = await resposta.json();

            if (resultado.status === "sucesso") {
                renderizarPainelSindico(resultado.dados);
            } else {
                document.getElementById('corpo-tabela').innerHTML = `<tr><td colspan='3' style='color: #ef4444; text-align: center;'>Erro: ${resultado.mensagem}</td></tr>`;
            }
        } catch (error) {
            console.error(error);
            document.getElementById('corpo-tabela').innerHTML = "<tr><td colspan='3' style='color: #ef4444; text-align: center; font-weight: 600;'>Erro de comunicação com o servidor do Google.</td></tr>";
        }
    }

    function renderizarPainelSindico(dados) {
        const corpo = document.getElementById('corpo-tabela');
        corpo.innerHTML = "";
        
        document.getElementById('total-registros').innerText = dados.length;

        if (dados.length === 0) {
            corpo.innerHTML = "<tr><td colspan='3' style='text-align: center; color: #64748b;'>Nenhum registro encontrado na planilha.</td></tr>";
            document.getElementById('total-geral').innerText = "0.00 kWh";
            return;
        }

        // LÓGICA DE MEDIÇÃO INTELIGENTE PARA O SÍNDICO:
        // Como o PZEM acumula, a soma total do condomínio é a soma da ÚLTIMA leitura de cada vaga diferente.
        const ultimasLeiturasPorVaga = {};
        
        // Exibe o histórico ordenado do mais recente para o mais antigo na tabela
        const dadosInvertidos = [...dados].reverse();

        dadosInvertidos.forEach(item => {
            // Guarda a leitura se for a primeira vez que vemos essa vaga vindo do topo (mais recente)
            if (!(item.vaga in ultimasLeiturasPorVaga)) {
                ultimasLeiturasPorVaga[item.vaga] = item.consumo;
            }

            const dataFormatada = new Date(item.data).toLocaleString('pt-BR');
            corpo.innerHTML += `<tr>
                <td>${dataFormatada}</td>
                <td><strong>${item.vaga}</strong></td>
                <td>${item.consumo.toFixed(2)} kWh</td>
            </tr>`;
        });

        // Soma o valor atual acumulado real de cada vaga individual do prédio
        let somaTotalCondominio = 0;
        for (const vaga in ultimasLeiturasPorVaga) {
            somaTotalCondominio += ultimasLeiturasPorVaga[vaga];
        }

        document.getElementById('total-geral').innerText = somaTotalCondominio.toFixed(2) + " kWh";
    }
</script>
</body>
</html>
